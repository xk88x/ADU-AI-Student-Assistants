<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b" />
    </marker>
    <marker id="dash-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="20" y="15" width="960" height="55" rx="8" fill="#1e293b" />
  <text x="500" y="42" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="bold">UML Sequence Diagram: UC-09 Lecture Upload &amp; UC-19 Summary Generation</text>
  <text x="500" y="60" text-anchor="middle" fill="#94a3b8" font-size="13">Member: Rayyan Daqqa (ID: 1097796) — Async AI Pipeline, Audio Deletion &amp; Section Publishing</text>

  <!-- Lifeline Headers -->
  <!-- Instructor -->
  <g transform="translate(90, 95)">
    <rect x="-55" y="0" width="110" height="35" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.8" filter="url(#shadow)" />
    <text x="0" y="22" text-anchor="middle" fill="#78350f" font-size="13" font-weight="bold">:Instructor</text>
    <line x1="0" y1="35" x2="0" y2="560" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />
  </g>

  <!-- StudySupportUI -->
  <g transform="translate(270, 95)">
    <rect x="-70" y="0" width="140" height="35" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.8" filter="url(#shadow)" />
    <text x="0" y="17" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="bold">«boundary»</text>
    <text x="0" y="30" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="bold">:StudySupportUI</text>
    <line x1="0" y1="35" x2="0" y2="560" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />
  </g>

  <!-- StudyGPAController -->
  <g transform="translate(480, 95)">
    <rect x="-75" y="0" width="150" height="35" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.8" filter="url(#shadow)" />
    <text x="0" y="17" text-anchor="middle" fill="#78350f" font-size="12" font-weight="bold">«control»</text>
    <text x="0" y="30" text-anchor="middle" fill="#78350f" font-size="12" font-weight="bold">:StudyGPAController</text>
    <line x1="0" y1="35" x2="0" y2="560" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />
  </g>

  <!-- Whisper+Ollama (Local AI) -->
  <g transform="translate(700, 95)">
    <rect x="-80" y="0" width="160" height="35" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.8" filter="url(#shadow)" />
    <text x="0" y="17" text-anchor="middle" fill="#0369a1" font-size="12" font-weight="bold">«subsystem»</text>
    <text x="0" y="30" text-anchor="middle" fill="#0369a1" font-size="12" font-weight="bold">:Whisper &amp; Ollama</text>
    <line x1="0" y1="35" x2="0" y2="560" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />
  </g>

  <!-- LectureSummary -->
  <g transform="translate(900, 95)">
    <rect x="-65" y="0" width="130" height="35" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8" filter="url(#shadow)" />
    <text x="0" y="17" text-anchor="middle" fill="#14532d" font-size="12" font-weight="bold">«entity»</text>
    <text x="0" y="30" text-anchor="middle" fill="#14532d" font-size="12" font-weight="bold">:LectureSummary</text>
    <line x1="0" y1="35" x2="0" y2="560" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />
  </g>

  <!-- Activation Bars -->
  <rect x="265" y="150" width="10" height="400" fill="#cbd5e1" stroke="#475569" />
  <rect x="475" y="170" width="10" height="360" fill="#fde68a" stroke="#b45309" />
  <rect x="695" y="195" width="10" height="150" fill="#bae6fd" stroke="#0284c7" />
  <rect x="895" y="365" width="10" height="160" fill="#bbf7d0" stroke="#15803d" />

  <!-- Messages -->
  <!-- 1: uploadRecording(sectionId, audioFile) -->
  <line x1="90" y1="155" x2="265" y2="155" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="177" y="148" text-anchor="middle" fill="#1e293b" font-size="11" font-weight="600">1: uploadRecording(sectionId, file)</text>

  <!-- 2: validateAndQueue(audioFile) -->
  <line x1="275" y1="175" x2="475" y2="175" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="375" y="168" text-anchor="middle" fill="#1e293b" font-size="11" font-weight="600">2: validateAndQueue(audioFile)</text>

  <!-- 3: transcribeAndExtract(audioFile) [UC-19] -->
  <line x1="485" y1="200" x2="695" y2="200" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="590" y="193" text-anchor="middle" fill="#1e293b" font-size="11" font-weight="600">3: transcribeAndExtract(audioFile) [UC-19]</text>

  <!-- 4: raw audio deleted <= 1 hr (NFR11) -->
  <line x1="695" y1="230" x2="485" y2="230" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="4,4" marker-end="url(#dash-arrow)" />
  <text x="590" y="222" text-anchor="middle" fill="#dc2626" font-size="11" font-weight="bold">4: transcript ready [Raw audio purged &lt;= 1 hr (NFR11)]</text>

  <!-- 5: extractExamFocus(transcript) -->
  <line x1="485" y1="265" x2="695" y2="265" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="590" y="258" text-anchor="middle" fill="#1e293b" font-size="11" font-weight="600">5: extractExamFocus(transcript)</text>

  <!-- 6: return (summaryText, examFocusTimestamps) -->
  <line x1="695" y1="300" x2="485" y2="300" stroke="#0284c7" stroke-width="1.6" stroke-dasharray="4,4" marker-end="url(#dash-arrow)" />
  <text x="590" y="292" text-anchor="middle" fill="#0284c7" font-size="11">6: return (summaryText, examFocusTimestamps)</text>

  <!-- 7: createDraftPDF(approved=false) -->
  <line x1="485" y1="340" x2="895" y2="340" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="690" y="332" text-anchor="middle" fill="#16a34a" font-size="11" font-weight="600">7: createDraftPDF(approved=false)</text>

  <!-- 8: notifyInstructorDraftReady() -->
  <line x1="475" y1="365" x2="275" y2="365" stroke="#0284c7" stroke-width="1.6" stroke-dasharray="4,4" marker-end="url(#dash-arrow)" />
  <text x="375" y="358" text-anchor="middle" fill="#0284c7" font-size="11">8: notifyInstructorDraftReady(draftId)</text>

  <!-- Alt Frame: Instructor Approves vs Withdraws -->
  <rect x="60" y="390" width="870" height="135" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5,3" />
  <rect x="60" y="390" width="45" height="20" fill="#fef3c7" stroke="#d97706" />
  <text x="82" y="404" text-anchor="middle" fill="#78350f" font-size="11" font-weight="bold">alt</text>
  <text x="120" y="404" fill="#78350f" font-size="11" font-weight="600">[Instructor Approves Draft Summary (UC-10)]</text>

  <!-- 9a: approveSummary(summaryId) -->
  <line x1="90" y1="430" x2="265" y2="430" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="177" y="423" text-anchor="middle" fill="#1e293b" font-size="11" font-weight="600">9a: approveSummary(summaryId)</text>

  <line x1="275" y1="445" x2="475" y2="445" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="375" y="438" text-anchor="middle" fill="#1e293b" font-size="11" font-weight="600">approveSummary(summaryId)</text>

  <line x1="485" y1="460" x2="895" y2="460" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="690" y="452" text-anchor="middle" fill="#16a34a" font-size="11" font-weight="bold">10: setApproved(true) &amp; publishToSection(sectionId)</text>

  <!-- Alt Divider -->
  <line x1="60" y1="475" x2="930" y2="475" stroke="#d97706" stroke-width="1" stroke-dasharray="3,3" />
  <text x="120" y="490" fill="#dc2626" font-size="11" font-weight="600">[Instructor Withdraws Draft -> Discard &amp; Publish Nothing]</text>

  <line x1="90" y1="510" x2="475" y2="510" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="4,4" marker-end="url(#dash-arrow)" />
  <text x="280" y="503" text-anchor="middle" fill="#dc2626" font-size="11">9b: withdrawSummary(summaryId) -&gt; deleteDraftPDF()</text>

  <!-- Footer Notice -->
  <rect x="60" y="585" width="870" height="65" rx="6" fill="#f1f5f9" stroke="#cbd5e1" />
  <text x="80" y="608" fill="#0f172a" font-size="12" font-weight="bold">Section Access Control &amp; Privacy Protocol (FR3.4 &amp; NFR10):</text>
  <text x="80" y="625" fill="#475569" font-size="11">• As shown in message 10, summaries are published strictly to enrolled students belonging to that specific course section.</text>
  <text x="80" y="640" fill="#475569" font-size="11">• Cross-section download attempts by unauthorized students trigger HTTP 403 Forbidden as verified in TC-4.1.</text>
</svg>