  <rect x="275" y="150" width="10" height="400" fill="#cbd5e1" stroke="#475569" />
  <rect x="475" y="170" width="10" height="360" fill="#fde68a" stroke="#b45309" />
  <rect x="675" y="195" width="10" height="60" fill="#fde68a" stroke="#b45309" />
  <rect x="875" y="325" width="10" height="180" fill="#bbf7d0" stroke="#15803d" />

  <!-- Messages -->
  <!-- 1: selectPlanNextSemester() -->
  <line x1="100" y1="155" x2="275" y2="155" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="187" y="148" text-anchor="middle" fill="#1e293b" font-size="11" font-weight="600">1: selectPlanNextSemester()</text>

  <!-- 2: getEligibleCourses(studentId) -->
  <line x1="285" y1="175" x2="475" y2="175" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="380" y="168" text-anchor="middle" fill="#1e293b" font-size="11" font-weight="600">2: getEligibleCourses(studentId)</text>

  <!-- 3: predictGPA(studentId) [UC-14] -->
  <line x1="485" y1="200" x2="675" y2="200" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="580" y="193" text-anchor="middle" fill="#1e293b" font-size="11" font-weight="600">3: predictGPA(studentId) [UC-14]</text>

  <!-- 4: return (predictedGPA, creditLimit) -->
  <line x1="675" y1="235" x2="485" y2="235" stroke="#0284c7" stroke-width="1.6" stroke-dasharray="4,4" marker-end="url(#dash-arrow)" />
  <text x="580" y="228" text-anchor="middle" fill="#0284c7" font-size="11" font-weight="600">4: return (predictedGPA, creditLimit: 12 if &lt; 2.0)</text>

  <!-- 5: displayEligible(courses, limit) -->
  <line x1="475" y1="265" x2="285" y2="265" stroke="#0284c7" stroke-width="1.6" stroke-dasharray="4,4" marker-end="url(#dash-arrow)" />
  <text x="380" y="258" text-anchor="middle" fill="#0284c7" font-size="11" font-weight="600">5: displayEligible(courses, creditLimit)</text>

  <!-- 6: selectCourses(courseIds) -->
  <line x1="100" y1="295" x2="275" y2="295" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="187" y="288" text-anchor="middle" fill="#1e293b" font-size="11" font-weight="600">6: selectCourses(courseIds)</text>

  <!-- 7: buildSchedule(courseIds) -->
  <line x1="285" y1="315" x2="475" y2="315" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="380" y="308" text-anchor="middle" fill="#1e293b" font-size="11" font-weight="600">7: buildSchedule(courseIds)</text>

  <!-- 8: hasClash(sections) -->
  <line x1="485" y1="335" x2="875" y2="335" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="680" y="328" text-anchor="middle" fill="#1e293b" font-size="11" font-weight="600">8: hasClash(sections)</text>

  <!-- Alt Frame: Clashing vs Clash-Free -->
  <rect x="250" y="360" width="670" height="150" fill="none" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="5,3" />
  <rect x="250" y="360" width="45" height="20" fill="#fee2e2" stroke="#e11d48" />
  <text x="272" y="374" text-anchor="middle" fill="#9f1239" font-size="11" font-weight="bold">alt</text>
  <text x="310" y="374" fill="#9f1239" font-size="11" font-weight="600">[No clash-free combination exists]</text>

  <!-- 9a: return clashingCourses -->
  <line x1="875" y1="395" x2="485" y2="395" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#dash-arrow)" />
  <text x="680" y="388" text-anchor="middle" fill="#e11d48" font-size="11">9a: return clashingCourses</text>

  <line x1="475" y1="415" x2="285" y2="415" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#dash-arrow)" />
  <text x="380" y="408" text-anchor="middle" fill="#e11d48" font-size="11">displayClashNotice(clashingCourses)</text>

  <!-- Alt divider -->
  <line x1="250" y1="435" x2="920" y2="435" stroke="#e11d48" stroke-width="1" stroke-dasharray="3,3" />
  <text x="310" y="450" fill="#15803d" font-size="11" font-weight="600">[Clash-free combination found]</text>

  <!-- 9b: return clashFreeSchedule -->
  <line x1="875" y1="470" x2="485" y2="470" stroke="#15803d" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#dash-arrow)" />
  <text x="680" y="463" text-anchor="middle" fill="#15803d" font-size="11">9b: return (draftSchedule, alternativeSections)</text>

  <line x1="475" y1="490" x2="285" y2="490" stroke="#15803d" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#dash-arrow)" />
  <text x="380" y="483" text-anchor="middle" fill="#15803d" font-size="11">10: displayTimetable(draftSchedule)</text>

  <!-- 11: submitToAdvisor() -->
  <line x1="100" y1="535" x2="275" y2="535" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="187" y="528" text-anchor="middle" fill="#1e293b" font-size="11" font-weight="600">11: submitToAdvisor() [UC-04]</text>

  <line x1="285" y1="545" x2="475" y2="545" stroke="#1e293b" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="380" y="538" text-anchor="middle" fill="#1e293b" font-size="11" font-weight="600">submitDraftToAdvisor(draftId)</text>

  <!-- Footer Notice -->
  <rect x="100" y="590" width="800" height="65" rx="6" fill="#f1f5f9" stroke="#cbd5e1" />
  <text x="120" y="612" fill="#0f172a" font-size="12" font-weight="bold">Message &amp; Class Integration Notes:</text>
  <text x="120" y="630" fill="#475569" font-size="11">• Operations match exactly with AdvisingController, StudyGPAController and ScheduleDraft defined in the Phase 3 Class Diagram.</text>
  <text x="120" y="645" fill="#475569" font-size="11">• Message 3 demonstrates the inter-module bridge from F1 into F3 to fetch the GPA ceiling before schedule building.</text>
</svg>