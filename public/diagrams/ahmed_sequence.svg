<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b" />
    </marker>
    <marker id="dash-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="20" y="15" width="960" height="55" rx="8" fill="#1e293b" />
  <text x="500" y="42" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="bold">UML Sequence Diagram: UC-03 Build Clash-Free Schedule</text>
  <text x="500" y="60" text-anchor="middle" fill="#94a3b8" font-size="13">Member: Ahmed Alameri (ID: 1090726) — Object Lifelines, Credit-Guard &amp; Alt Frames</text>

  <!-- Lifeline Headers -->
  <!-- Student -->
  <g transform="translate(100, 95)">
    <rect x="-55" y="0" width="110" height="35" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.8" filter="url(#shadow)" />
    <text x="0" y="22" text-anchor="middle" fill="#0369a1" font-size="13" font-weight="bold">:Student</text>
    <line x1="0" y1="35" x2="0" y2="560" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />
  </g>

  <!-- AdvisingUI -->
  <g transform="translate(280, 95)">
    <rect x="-65" y="0" width="130" height="35" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.8" filter="url(#shadow)" />
    <text x="0" y="17" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="bold">«boundary»</text>
    <text x="0" y="30" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="bold">:AdvisingUI</text>
    <line x1="0" y1="35" x2="0" y2="560" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />
  </g>

  <!-- AdvisingController -->
  <g transform="translate(480, 95)">
